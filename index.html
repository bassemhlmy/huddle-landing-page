<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
</head>

<body>

  <main class="main">

    <!-- Logo -->
    <div class="logo-wrapper">
      <img src="images/logo.svg" class="logo" alt="Huddle logo" />
    </div>

    <!-- Hero content -->
    <div class="hero container-fluid">
      <div class="row align-items-center gx-5">

        <!-- Illustration -->
        <div class="col-12 col-md-6 illustration-col">
          <img src="images/illustration-mockups.svg" alt="App mockup illustration" class="img-fluid illustration" />
        </div>

        <!-- Text + CTA -->
        <div class="col-12 col-md-6 col-xl-5 text-col">
          <h1>Build The Community Your Fans Will Love</h1>
          <p>
            Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
            Create connections with your users as you engage in genuine discussion.
          </p>
          <a href="#" class="btn-register">Register</a>
        </div>

      </div>
    </div>

    <!-- Social Icons -->
    <div class="social-icons">
      <a href="#" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="#" aria-label="Twitter">
        <i class="fab fa-twitter"></i>
      </a>
      <a href="#" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
